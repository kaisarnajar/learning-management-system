name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  verify:
    name: Static checks and test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable database for the DB-backed suites (they TRUNCATE every table).
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/lms_test
      # Scratch database for the authoritative migration drift check.
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_shadow
      # Prisma needs the variables to exist; nothing here touches a real database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      CSP_ENFORCE: "true"
      # Render a real receipt in tests/integration/pdf-smoke.test.ts; `npm ci`
      # downloads Puppeteer's Chrome, and the PDF stylesheet is built below.
      PDF_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the PDF stylesheet
        run: npm run build:pdf-css

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        # New violations fail; the pre-existing ones are recorded in eslint-suppressions.json.
        run: npx eslint . --ignore-pattern ".claude/**"

      - name: Build the application
        # Catches build-only failures (route segment config, server/client
        # boundaries, prerender errors) before merge, not after.
        run: npx next build

      - name: Create the shadow database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE lms_shadow'

      - name: Migration drift
        run: npm run db:drift

      - name: Migration safety (no destructive SQL)
        run: npm run db:safety

      - name: Protected pages call an explicit auth check
        run: bash scripts/check-page-auth.sh

      - name: .env.example lists every variable the code reads
        run: bash scripts/check-env-example.sh

      - name: Dependency audit (production, high and critical)
        # Runs `npm audit --omit=dev` and fails on any high or critical advisory
        # not reviewed in scripts/audit-allowlist.json (each entry: one advisory
        # on one package, with a review date).
        run: node scripts/check-audit.mjs

      - name: Test suites with coverage
        # One run of all four projects (unit, then integration, api and
        # security one after another; see sequence.groupOrder in
        # vitest.config.mts), failing below the services/ coverage thresholds.
        run: npm run test:coverage

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end journeys
    needs: verify
    # After every push to dev/master, and before merge on pull requests into
    # master: master is production (docs/CONTRIBUTING.md), so the journeys
    # must pass before the merge, not only after it.
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/lms_test
      # The build only needs the variables to exist; the server started by
      # Playwright is given DATABASE_URL_TEST (see playwright.config.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      CSP_ENFORCE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the PDF stylesheet
        run: npm run build:pdf-css

      - name: Build the application
        run: npx next build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # Playwright starts the web server before its global setup runs, and the
      # server's readiness check renders a page that reads the database, so the
      # schema has to exist first (global setup re-runs this as a no-op).
      - name: Apply the migrations to the e2e database
        run: npx prisma migrate deploy

      - name: Run the journeys
        run: npm run test:e2e

      - name: Keep the report when a journey fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
