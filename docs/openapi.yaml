  # -------------------------------------------------------- Teacher: Blogs
  /teacher/blogs:
    get:
      tags: ["Teacher: Blogs"]
      summary: The teacher's own posts, newest first
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      maxImages: { type: integer }
                      data: { items: { allOf: [{ $ref: "#/components/schemas/BlogRow" }, { properties: { canEdit: { type: boolean }, canDelete: { type: boolean } } }] } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: ["Teacher: Blogs"]
      summary: Submits a new post for approval
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [title, body], properties: { title: { type: string }, excerpt: { type: string }, body: { type: string, description: HTML }, images: { type: array, items: { type: string, format: binary } } } }
          multipart/form-data:
            schema: { type: object, required: [title, body], properties: { title: { type: string }, excerpt: { type: string }, body: { type: string, description: HTML }, images: { type: array, items: { type: string, format: binary } } } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teacher/blogs/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: ["Teacher: Blogs"]
      summary: One of the teacher's own posts (404 for anyone else's)
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  maxImages: { type: integer }
                  post: { allOf: [{ $ref: "#/components/schemas/BlogDetail" }, { properties: { canEdit: { type: boolean }, canDelete: { type: boolean } } }] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: ["Teacher: Blogs"]
      summary: Edits the post and resubmits it for approval
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [title, body], properties: { title: { type: string }, excerpt: { type: string }, body: { type: string, description: HTML }, removeImage: { type: array, items: { type: string }, description: Image ids to remove }, images: { type: array, items: { type: string, format: binary } } } }
          multipart/form-data:
            schema: { type: object, required: [title, body], properties: { title: { type: string }, excerpt: { type: string }, body: { type: string, description: HTML }, removeImage: { type: array, items: { type: string }, description: Image ids to remove }, images: { type: array, items: { type: string, format: binary } } } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The post is approved or awaiting review and can no longer be edited, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: ["Teacher: Blogs"]
      summary: Deletes one of the teacher's own posts
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The post can no longer be changed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # -------------------------------------------------------- Teacher: Fatwa
  /teacher/fatwa:
    get:
      tags: ["Teacher: Fatwa"]
      summary: Questions the teacher may answer (unanswered ones and their own answers)
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { $ref: "#/components/parameters/Q" }, { name: filter, in: query, schema: { type: string, enum: [unanswered, pending, answered, rejected] } }]
      responses:
        "200": { description: Questions (no asker details), content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { properties: { data: { items: { $ref: "#/components/schemas/FatwaRow" } } } }] } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teacher/fatwa/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: ["Teacher: Fatwa"]
      summary: "A question: unanswered, or answered by this teacher (404 otherwise)"
      responses:
        "200": { description: The question; `canEdit` is false while the answer awaits review and once it is approved, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, question: { allOf: [{ $ref: "#/components/schemas/FatwaDetail" }, { properties: { canEdit: { type: boolean } } }] } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /teacher/fatwa/{id}/answer:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: ["Teacher: Fatwa"]
      summary: Saves the teacher's answer and submits it for admin approval
      requestBody:
        required: true
