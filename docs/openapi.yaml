  # -------------------------------------------------- Admin: Announcements
  /admin/announcements:
    get:
      tags: ["Admin: Announcements"]
      summary: Site announcements, newest first
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { $ref: "#/components/parameters/Q" }]
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data: { items: { $ref: "#/components/schemas/SiteAnnouncementRow" } }
                      featuredCount: { type: integer }
                      featuredMax: { type: integer }
                      maxImages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: ["Admin: Announcements"]
      summary: Adds an announcement (a published one notifies every student)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteAnnouncementForm" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SiteAnnouncementForm" }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/announcements/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: ["Admin: Announcements"]
      summary: One announcement with its images (drafts included)
      responses:
        "200":
          description: The announcement
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FeaturedSlots"
                  - type: object
                    properties:
                      success: { type: boolean }
                      maxImages: { type: integer }
                      announcement:
                        allOf:
                          - $ref: "#/components/schemas/SiteAnnouncementRow"
                          - type: object
                            properties:
                              body: { type: string }
                              eventDateInput: { type: [string, "null"], description: YYYY-MM-DD }
                              images: { type: array, items: { $ref: "#/components/schemas/ImageRow" } }
                              updatedAt: { type: string, format: date-time }
                              publicPath: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: ["Admin: Announcements"]
      summary: Edits an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteAnnouncementForm" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SiteAnnouncementForm" }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: ["Admin: Announcements"]
      summary: Deletes the announcement and its images
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
