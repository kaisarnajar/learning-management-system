        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: ["Admin: Teachers"]
      summary: Deletes the teacher profile (refused while courses are assigned); the account stays
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------- Admin: Enrollments
  /admin/enrollments:
    get:
      tags: ["Admin: Enrollments"]
      summary: Pending enrollments (free requests or paid awaiting the fee)
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Q" }
        - { name: type, in: query, schema: { type: string, enum: [free_requests, paid_awaiting], default: free_requests } }
      responses:
        "200":
          description: The tab's enrollments, both tabs' counts and the courses the enrol form offers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      type: { type: string, enum: [free_requests, paid_awaiting] }
                      freeCount: { type: integer }
                      paidCount: { type: integer }
                      enrollableCourses: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string } } } }
                      data:
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            courseId: { type: string }
                            courseTitle: { type: string }
                            status: { $ref: "#/components/schemas/EnrollmentStatus" }
                            createdAt: { type: string, format: date-time }
                            user: { $ref: "#/components/schemas/UserRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: ["Admin: Enrollments"]
      summary: Enrols a registered account in a course
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, courseId], properties: { email: { type: string, format: email }, courseId: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/enrollments/lookup:
    get:
      tags: ["Admin: Enrollments"]
      summary: Checks the account behind an e-mail for the enrol form
      parameters: [{ name: email, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: The check, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, lookup: { $ref: "#/components/schemas/AccountLookup" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/enrollments/{id}:
    delete:
      tags: ["Admin: Enrollments"]
      summary: Removes a student from one course; the account stays
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: courseId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/enrollments/{id}/approve:
    post:
      tags: ["Admin: Enrollments"]
      summary: Approves a free-course enrollment request
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [courseId], properties: { courseId: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/enrollments/{id}/reject:
    post:
      tags: ["Admin: Enrollments"]
      summary: Rejects a pending enrollment (free request or paid awaiting the fee)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [courseId], properties: { courseId: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

