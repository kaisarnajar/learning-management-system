      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The student's profile is not complete, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/students/{id}/id-card/email:
    post:
      tags: ["Admin: Students"]
      summary: E-mails the ID card PDF to the student
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------- Admin: Teachers
  /admin/teachers:
    get:
      tags: ["Admin: Teachers"]
