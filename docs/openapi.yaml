openapi: 3.1.0
info:
  title: Academy LMS mobile API
  version: "1.0.0"
  description: |
    The REST API the Android app uses (guest and student features, and the
    staff areas under /admin for admins and developers and /teacher for
    teachers). See docs/API.md for the conventions, the token refresh rules and
    the typical flows. Money is in paise; lists are paginated with page/pageSize.

    Staff writes take JSON, multipart or URL-encoded bodies with the website
    form's field names. In JSON, `true` is sent as the checkbox value "on" and
    `false`/null are left out; fields documented as the string "true" must be
    sent as that string.
servers:
  - url: https://darsequranacademy.com/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Auth
  - name: Account
  - name: Public
  - name: Blog
  - name: Courses
  - name: Payments
  - name: Bookstore
  - name: Notifications
  - name: "Admin: Dashboard"
    description: Admins and developers only, as are all /admin endpoints
  - name: "Admin: Students"
  - name: "Admin: Teachers"
  - name: "Admin: Enrollments"
  - name: "Admin: Courses"
    description: Courses and their tools (roster, announcements, attendance, grade cards, student cards)
  - name: "Admin: Announcements"
  - name: "Admin: Daily inspiration"
  - name: "Admin: Blogs"
  - name: "Admin: Fatwa"
  - name: "Admin: Library"
  - name: "Admin: Reviews"
  - name: "Admin: Contact inquiries"
  - name: "Admin: Payments"
  - name: "Admin: Finance"
  - name: "Admin: Coupons"
  - name: "Admin: Receipts"
  - name: "Admin: Certificates"
  - name: "Admin: Bookstore"
  - name: "Admin: Settings"
  - name: "Teacher: Courses"
    description: Teachers only, as are all /teacher endpoints; a course that is not assigned to the teacher is a 404
  - name: "Teacher: Blogs"
  - name: "Teacher: Fatwa"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Search:
      name: search
      in: query
      schema: { type: string }
    Q:
      name: q
      in: query
      description: Search text (the staff lists also accept it as `search`)
      schema: { type: string }
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string }
    AnnouncementId:
      name: announcementId
      in: path
      required: true
      schema: { type: string }
    GradeId:
      name: gradeId
      in: path
      required: true
      schema: { type: string }
    AttendanceDate:
      name: date
      in: path
      required: true
      description: The class day, YYYY-MM-DD
      schema: { type: string, format: date }
    BookId:
      name: bookId
      in: path
      required: true
      schema: { type: string }
    FinancePreset:
      name: preset
      in: query
      description: Date range; `custom` uses `from` and `to`
      schema: { type: string, enum: [this_month, last_month, this_year, all_time, custom] }
    FinanceFrom:
      name: from
      in: query
      description: Start of a custom range, YYYY-MM-DD
      schema: { type: string, format: date }
    FinanceTo:
      name: to
      in: query
      description: End of a custom range, YYYY-MM-DD
      schema: { type: string, format: date }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in, or the session has ended (refresh once, then sign in again)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (also used for records that belong to someone else)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate-limited; see the Retry-After header
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Ok:
      description: Done
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Ok" }
    Forbidden:
      description: >-
        Signed in without the staff role this endpoint needs (or a teacher account with no teacher profile).
        A staff role is granted only once the account's e-mail address is verified; until then the account acts as USER.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StaffWrite:
      description: Done
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StaffWrite" }
    Pdf:
      description: The PDF
      content:
        application/pdf:
          schema: { type: string, format: binary }

    CourseAnnouncements:
      description: Announcements, newest first, with the course, the student (private messages only) and the categories
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Page"
              - type: object
                properties:
                  data: { items: { $ref: "#/components/schemas/CourseAnnouncement" } }
                  course: { $ref: "#/components/schemas/CourseHeader" }
                  student:
                    oneOf:
                      - type: object
                        properties:
                          enrollmentId: { type: string }
                          name: { type: string }
                          email: { type: string }
                      - type: "null"
                  categories: { type: array, items: { $ref: "#/components/schemas/Option" } }
    CourseAnnouncement:
      description: The announcement and the categories
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              announcement: { $ref: "#/components/schemas/CourseAnnouncement" }
              categories: { type: array, items: { $ref: "#/components/schemas/Option" } }
    CourseStudents:
      description: The active students, for the attendance or grade form
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              data: { type: array, items: { $ref: "#/components/schemas/CourseStudent" } }
    AttendanceHistory:
      description: One row per class day with present and absent counts
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              course: { $ref: "#/components/schemas/CourseHeader" }
              data:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    date: { type: string, format: date }
                    dateLabel: { type: string }
                    present: { type: integer }
                    absent: { type: integer }
                    total: { type: integer }
    AttendanceDay:
      description: The day's attendance, by roll number
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              date: { type: string, format: date }
              dateLabel: { type: string }
              present: { type: integer }
              absent: { type: integer }
              total: { type: integer }
              records:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/CourseStudent"
                    - type: object
                      properties:
                        isPresent: { type: boolean }
    StudentAttendance:
      description: The student's attendance in every class, with the summary
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              student: { $ref: "#/components/schemas/StudentReportStudent" }
              courseTitle: { type: string }
              summary:
                type: object
                properties:
                  total: { type: integer }
                  present: { type: integer }
                  absent: { type: integer }
                  percentage: { type: integer }
              records:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    date: { type: string, format: date }
                    dateLabel: { type: string }
                    isPresent: { type: boolean }
              canDownloadCard: { type: boolean, description: True for admins }
    GradeCards:
      description: The course's grade cards (test reports)
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              course: { $ref: "#/components/schemas/CourseHeader" }
              data:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    date: { type: string, format: date }
                    dateLabel: { type: string }
                    maxMarks: { type: number }
                    graded: { type: integer, description: Students with marks }
    GradeCard:
      description: The grade card with every student's marks
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              grade:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  date: { type: string, format: date }
                  dateLabel: { type: string }
                  maxMarks: { type: number }
                  records:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/CourseStudent"
                        - type: object
                          properties:
                            marksObtained: { type: [number, "null"] }
    StudentGrades:
      description: The student's marks in every graded test, with the totals
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              student: { $ref: "#/components/schemas/StudentReportStudent" }
              courseTitle: { type: string }
              summary:
                type: object
                properties:
                  exams: { type: integer }
                  obtained: { type: number }
                  max: { type: number }
                  percentage: { type: integer }
              records:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    date: { type: string, format: date }
                    dateLabel: { type: string }
                    maxMarks: { type: number }
                    marksObtained: { type: number }
              canDownloadCard: { type: boolean, description: True for admins }

  requestBodies:
    Announcement:
      required: true
      content:
        multipart/form-data:
          schema: { $ref: "#/components/schemas/AnnouncementForm" }
        application/json:
          schema: { $ref: "#/components/schemas/AnnouncementForm" }
    AttendanceSave:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [records]
            properties:
              records:
                type: array
                items:
                  type: object
                  required: [enrollmentId, isPresent]
                  properties:
                    enrollmentId: { type: string }
                    isPresent: { type: boolean }
    GradeCard:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GradeCardInput" }

  schemas:
    Ok:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error: { type: string, description: Message to show to the user }
        code:
          type: string
          description: Set for cases the app handles specially
          enum: [email_not_verified]
    Page:
      type: object
      required: [success, data, totalCount, page, pageSize]
      properties:
        success: { type: boolean }
        data: { type: array, items: {} }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Tokens:
      type: object
      required: [success, accessToken, expiresIn, refreshToken, refreshExpiresAt, user]
      properties:
        success: { type: boolean }
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconds }
        refreshToken: { type: string, description: Single use }
        refreshExpiresAt: { type: string, format: date-time }
        token: { type: string, deprecated: true, description: Same as accessToken }
        user: { $ref: "#/components/schemas/SessionUser" }
    SessionUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: [string, "null"] }
        role: { type: string, enum: [USER, TEACHER, ADMIN, DEVELOPER], description: "USER until the e-mail address is verified" }
        image: { type: [string, "null"] }
        registrationNumber: { type: [string, "null"] }
        emailVerified: { type: [string, "null"], format: date-time }

    Profile:
      type: object
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: string }
        fatherName: { type: [string, "null"] }
        dateOfBirth: { type: [string, "null"], format: date-time }
        occupation: { type: [string, "null"], description: "Value from /app-config lookups.occupations" }
        address: { type: [string, "null"] }
        whatsapp: { type: [string, "null"], description: Stored digits with the dial code }
        whatsappCountry: { type: [string, "null"], description: ISO country code }
        whatsappLocal: { type: [string, "null"] }
        gender: { type: [string, "null"], enum: [MALE, FEMALE, null] }
        registrationNumber: { type: [string, "null"] }
        emailVerified: { type: [string, "null"], format: date-time }
        image: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        role: { type: string }
        profileComplete: { type: boolean }
        hasPassword: { type: boolean }
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        fatherName: { type: string, minLength: 2, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        occupation: { type: string }
        address: { type: string }
        gender: { type: string, enum: [MALE, FEMALE] }
        country: { type: string, description: "ISO code; makes whatsapp a local number" }
        whatsapp: { type: string }
        image:
          type: [string, "null"]
          description: >-
            Only the bundled avatars (/assets/male_icon.png, /assets/female_icon.png) or a Google photo
            (https://*.googleusercontent.com). Upload a photo with POST /auth/me/photo instead; a storage URL
            is refused (400) unless it is the profile's current image, which is then left unchanged.

    Teacher:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        specialization: { type: string }
        bio: { type: string }
        initials: { type: string }
        imageUrl: { type: [string, "null"] }
    Course:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        startDate: { type: string }
        duration: { type: string }
        level: { type: string }
        category: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, ONGOING, COMPLETED, ON_HOLD, COMING_SOON] }
        priceInrPaise: { type: integer, description: Enrollment fee }
        monthlyFeeInrPaise: { type: integer, description: Course fee per period }
        feeFrequency: { type: [string, "null"], enum: [MONTHLY, EVERY_3_MONTHS, EVERY_6_MONTHS, YEARLY, ONE_TIME, null] }
        teacherId: { type: [string, "null"] }
        teacher: { oneOf: [{ $ref: "#/components/schemas/Teacher" }, { type: "null" }] }
    Book:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        description: { type: string }
        priceInrPaise: { type: integer }
        mrpInrPaise: { type: integer }
        status: { type: string, enum: [AVAILABLE, OUT_OF_STOCK, COMING_SOON] }
        imagePath: { type: [string, "null"] }
    Fatwa:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        question: { type: string }
        category: { type: string }
        answer: { type: [string, "null"], description: Sanitised HTML }
        askerName: { type: string, description: '"Anonymous" when the asker chose so' }
        answeredAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    CartItem:
      type: object
      properties:
        bookId: { type: string }
        title: { type: string }
        author: { type: string }
        priceInrPaise: { type: integer }
        mrpInrPaise: { type: integer }
        imagePath: { type: [string, "null"] }
        quantity: { type: integer }
    Cart:
      type: object
      properties:
        success: { type: boolean }
        items: { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        data: { type: array, items: { $ref: "#/components/schemas/CartItem" }, deprecated: true }
    CartLine:
      type: object
      required: [bookId, quantity]
      properties:
        bookId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20 }
    Comment:
      type: object
      properties:
        id: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: [string, "null"] }
            image: { type: [string, "null"] }

    PaymentSubmission:
      type: object
      required: [courseId, paymentType]
      properties:
        courseId: { type: string }
        paymentType: { type: string, enum: [enrollment, monthly] }
        paymentMonth: { type: string, pattern: "^(0[1-9]|1[0-2])$", description: 'Course fees only; "01" for one-time fees' }
        paymentYear: { type: string, pattern: "^[0-9]{4}$", description: "Course fees only; one of the quote's yearOptions. Ignored for one-time fees, which are paid once per course whatever the year" }
        paymentMethod: { type: string, enum: [upi, bank] }
        upiTransactionId: { type: string, description: Letters and digits; required unless the amount is 0 }
        couponId: { type: string, description: 'A coupon id from the quote, or "none"' }
        expectedAmountPaise: { type: integer, description: The amount shown; a different server price answers 409 }
        screenshot: { type: string, format: binary, description: Multipart only }
    BookOrder:
      type: object
      required: [items, paymentMethod, upiTransactionId, deliveryAddress, deliveryPinCode, deliveryPhoneNumber]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CartLine" }, description: In multipart, a JSON string }
        paymentMethod: { type: string }
        upiTransactionId: { type: string }
        deliveryAddress: { type: string, minLength: 10 }
        deliveryPinCode: { type: string, pattern: "^[0-9]{5,10}$" }
        deliveryPhoneNumber: { type: string, pattern: "^[0-9]{10,15}$" }
        notes: { type: string }
        screenshot: { type: string, format: binary, description: Multipart only }

    # ------------------------------------------------------------ Staff
    StaffWrite:
      type: object
      required: [success]
      description: |
        The outcome of a staff write. The endpoints run the website's own server
        actions: when the action redirects, `redirect` is the website page it went
        to (it may carry flags such as `email=failed`); otherwise `result` is the
        action's return value (often null, or `{ success, message }`).
      properties:
        success: { type: boolean, const: true }
        redirect: { type: string }
        result: {}
    Option:
      type: object
      properties:
        value: { type: string }
        label: { type: string }
    UserRef:
      type: object
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: string }
    StaffStudent:
      type: object
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: string }
        registrationNumber: { type: [string, "null"] }
        image: { type: [string, "null"] }
        gender: { type: [string, "null"], enum: [MALE, FEMALE, null] }
        createdAt: { type: string, format: date-time }
    StaffStudentDetail:
      allOf:
        - $ref: "#/components/schemas/StaffStudent"
        - type: object
          properties:
            fatherName: { type: [string, "null"] }
            dateOfBirth: { type: [string, "null"], format: date-time }
            dateOfBirthDisplay: { type: [string, "null"] }
            occupation: { type: [string, "null"] }
            occupationLabel: { type: [string, "null"] }
            address: { type: [string, "null"] }
            whatsapp: { type: [string, "null"] }
            profileComplete: { type: boolean }
            enrollments:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  courseId: { type: string }
                  courseTitle: { type: string }
                  rollNumber: { type: [string, "null"], description: Formatted roll number }
                  status: { $ref: "#/components/schemas/EnrollmentStatus" }
                  statusLabel: { type: string }
                  createdAt: { type: string, format: date-time }
    StaffStudentForm:
      type: object
      required: [name, fatherName, dateOfBirth, occupation, address, whatsapp, gender]
      properties:
        name: { type: string }
        fatherName: { type: string }
        dateOfBirth: { type: string, format: date }
        occupation: { type: string, description: "Value from /app-config lookups.occupations" }
        address: { type: string }
        whatsapp: { type: string }
        gender: { type: string, enum: [MALE, FEMALE] }
        confirmReplacePhoto: { type: string, enum: ["on"], description: Required when switching a student with an uploaded photo to FEMALE (the photo is replaced by the avatar) }
    EnrollmentStatus:
      type: string
      enum: [PENDING_APPROVAL, AWAITING_ENROLLMENT_FEE, ACTIVE, COMPLETED, REJECTED]
    StaffTeacher:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: [string, "null"] }
        specialization: { type: string }
        initials: { type: string }
        imageUrl: { type: [string, "null"] }
        published: { type: boolean }
        createdAt: { type: string, format: date-time }
    TeacherForm:
      type: object
      required: [email, specialization, bio]
      properties:
        email: { type: string, format: email, description: A registered account }
        specialization: { type: string }
        bio: { type: string }
        initials: { type: string, description: Derived from the account name when blank }
        published: { type: string, enum: ["on"], description: '"on" (JSON true) to show the teacher publicly' }
    AccountLookup:
      oneOf:
        - type: object
          properties:
            ok: { type: boolean, const: true }
            userId: { type: string }
            name: { type: [string, "null"] }
            email: { type: string }
            image: { type: [string, "null"] }
        - type: object
          properties:
            ok: { type: boolean, const: false }
            error: { type: string }
    DashboardLink:
      type: object
      properties:
        href: { type: string, description: The website path; the app maps it to its own screen }
        label: { type: string }
        count: { type: [integer, "null"], description: Null for tool pages with no number }
        highlight: { type: boolean, description: Needs action }

    CourseStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ONGOING, COMPLETED, ON_HOLD, COMING_SOON]
    CourseHeader:
      type: object
      description: The course header both portals' course pages show
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/CourseStatus" }
        statusLabel: { type: string }
        category: { type: string }
        level: { type: string }
        startDate: { type: [string, "null"] }
        duration: { type: [string, "null"] }
    AdminCourseRow:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        level: { type: string }
        teacherName: { type: [string, "null"] }
        duration: { type: [string, "null"] }
        registrationFeePaise: { type: integer }
        feePaise: { type: integer, description: Course fee per period }
        feeFrequency: { type: string, enum: [MONTHLY, EVERY_3_MONTHS, EVERY_6_MONTHS, YEARLY, ONE_TIME] }
        feeFrequencyLabel: { type: string }
        studentCount: { type: integer }
        status: { $ref: "#/components/schemas/CourseStatus" }
        statusLabel: { type: string }
        featured: { type: boolean }
        deleteWarning: { type: [string, "null"], description: Why a delete would be refused (students enrolled) }
    CourseForm:
      type: object
      description: The website's course form. Fees are in rupees.
      required: [title, description, category, level, status]
      properties:
        title: { type: string }
        description: { type: string }
        startDate: { type: string, format: date }
        duration: { type: string }
        category: { type: string }
        teacherId: { type: string }
        level: { type: string, enum: [Beginner, Intermediate, Advanced] }
        enrollmentFeeInr: { type: number }
