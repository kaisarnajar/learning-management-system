        "200": { description: The course header, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, course: { $ref: "#/components/schemas/CourseHeader" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /teacher/courses/{id}/students:
