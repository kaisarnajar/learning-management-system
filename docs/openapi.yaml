  # ---------------------------------------------------------- Admin: Fatwa
  /admin/fatwa:
    get:
      tags: ["Admin: Fatwa"]
      summary: Fatwa questions, newest first
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { $ref: "#/components/parameters/Q" }, { name: filter, in: query, description: "pending: a teacher's answer awaits review", schema: { type: string, enum: [unanswered, pending, answered, rejected] } }]
      responses:
        "200": { description: Questions, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { properties: { data: { items: { $ref: "#/components/schemas/FatwaRow" } } } }] } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/fatwa/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: ["Admin: Fatwa"]
      summary: One question with its current answer
      responses:
        "200":
          description: The question
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FeaturedSlots"
                  - type: object
                    properties:
                      success: { type: boolean }
                      question: { $ref: "#/components/schemas/FatwaDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: ["Admin: Fatwa"]
      summary: Deletes the question
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/fatwa/{id}/answer:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: ["Admin: Fatwa"]
      summary: Publishes or updates the answer, approving a teacher's pending one
      description: |
        The asker is e-mailed the first time the answer goes live; `redirect` carries
        `email=anonymous|skipped|failed` when no e-mail went out.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [answer], properties: { answer: { type: string, minLength: 20, description: HTML; sanitised by the website }, featuredOnHomepage: { type: string, enum: ["on"] } } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/fatwa/{id}/reject:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: ["Admin: Fatwa"]
      summary: Rejects a teacher's pending answer (the teacher is e-mailed)
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { answer: { type: string, description: The answer as the review form sends it } } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

