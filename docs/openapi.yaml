                      completedAt: { type: [string, "null"], format: date-time }
                  student:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string, description: The e-mail when no name is set }
                      email: { type: string }
                      fatherName: { type: [string, "null"] }
                      dateOfBirthDisplay: { type: [string, "null"] }
                      occupationLabel: { type: [string, "null"] }
