  # ---------------------------------------------------------------- Blog
  /blog/{id}/comments:
    get:
      tags: [Blog]
      security: []
      parameters: [{ $ref: "#/components/parameters/Id" }, { name: skip, in: query, schema: { type: integer, minimum: 0 } }]
      responses:
        "200": { description: Comments, newest first, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { type: array, items: { $ref: "#/components/schemas/Comment" } } } } } } }
    post:
      tags: [Blog]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content], properties: { content: { type: string, maxLength: 2000 } } }
      responses:
        "201": { description: Added, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, comment: { $ref: "#/components/schemas/Comment" } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /blog/{id}/like:
    post:
      tags: [Blog]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: New state, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, liked: { type: boolean }, likeCount: { type: integer } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /blog/comments/{commentId}:
    parameters: [{ name: commentId, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [Blog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content], properties: { content: { type: string, maxLength: 2000 } } }
      responses:
        "200": { description: Edited, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, comment: { $ref: "#/components/schemas/Comment" } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Blog]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------- Courses
  /enrollments:
    get:
      tags: [Courses]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses:
        "200": { description: The caller's enrollments, content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } } }
    post:
      tags: [Courses]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [courseId], properties: { courseId: { type: string } } }
      responses:
        "200": { description: Applied (or already enrolled), content: { application/json: { schema: { type: object } } } }
        "400": { description: Course closed, or profile incomplete (profileIncomplete true), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: E-mail not verified, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /courses/{id}/announcements:
    get:
      tags: [Courses]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: coursePage, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Course-wide announcements and private messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  courseWide: { type: array, items: { type: object } }
                  courseWideTotal: { type: integer }
                  personal: { type: array, items: { type: object } }
                  personalTotal: { type: integer }
  /student/attendance:
    get:
      tags: [Courses]
      parameters: [{ name: courseId, in: query, schema: { type: string } }]
      responses:
        "200": { description: Attendance per enrollment, content: { application/json: { schema: { type: object } } } }
  /student/grades:
    get:
      tags: [Courses]
      parameters: [{ name: courseId, in: query, schema: { type: string } }]
      responses:
        "200": { description: Grades per enrollment, content: { application/json: { schema: { type: object } } } }
  /waiver-requests:
    get:
      tags: [Courses]
      responses:
        "200": { description: The caller's waiver requests, content: { application/json: { schema: { type: object } } } }
    post:
      tags: [Courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, reason]
              properties:
                courseId: { type: string }
                feeType: { type: string, enum: [enrollment, course, both], default: both }
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        "200": { description: Requested, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Error" }
  /reviews:
    get:
      tags: [Courses]
      responses:
        "200": { description: The caller's reviews, content: { application/json: { schema: { type: object } } } }
    post:
      tags: [Courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote, rating]
              properties:
                quote: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                course: { type: string }
                location: { type: string }
      responses:
        "200": { description: Submitted for approval, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ Payments
  /payments/quote:
    get:
      tags: [Payments]
      parameters:
        - { name: courseId, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [enrollment, course] } }
      responses:
        "200":
          description: What to show on the pay screen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  canPay: { type: boolean }
                  reason: { type: [string, "null"] }
                  baseAmountPaise: { type: integer }
                  coupons:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        code: { type: string }
                        percentage: { type: integer }
                        type: { type: string, enum: [DEFAULT, SPECIAL] }
                        validUntil: { type: string, format: date-time }
                        amountPaise: { type: integer }
                  feeFrequency: { type: string }
                  feeFrequencyLabel: { type: string }
                  paymentType: { type: string }
                  oneTimeFee: { type: boolean }
                  yearOptions: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payments/submit:
    post:
      tags: [Payments]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/PaymentSubmission" }
          application/json:
            schema: { $ref: "#/components/schemas/PaymentSubmission" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: E-mail not verified, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Amount changed or already submitted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /payments/history:
    get:
      tags: [Payments]
      responses:
        "200": { description: Submissions and payment records, content: { application/json: { schema: { type: object } } } }
  /payments/{id}/receipt:
    get:
      tags: [Payments]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: The receipt, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not issued yet, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ----------------------------------------------------------- Bookstore
  /bookstore/cart:
    get:
      tags: [Bookstore]
      responses:
        "200": { description: The cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
    post:
      tags: [Bookstore]
      description: Replaces the cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/CartLine" } } } }
      responses:
        "200": { description: The cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
    patch:
      tags: [Bookstore]
      description: Sets one line; quantity 0 removes it
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [bookId, quantity], properties: { bookId: { type: string }, quantity: { type: integer, minimum: 0 } } }
      responses:
        "200": { description: The cart, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bookstore/checkout-quote:
    post:
      tags: [Bookstore]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/CartLine" } } } }
      responses:
        "200":
          description: Priced order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  lines: { type: array, items: { type: object, properties: { bookId: { type: string }, title: { type: string }, quantity: { type: integer }, unitPriceInrPaise: { type: integer }, lineTotalInrPaise: { type: integer } } } }
                  subtotalAmountInrPaise: { type: integer }
                  shippingChargeInrPaise: { type: integer }
                  totalAmountInrPaise: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "409": { description: Not enough stock, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /bookstore/orders:
    get:
      tags: [Bookstore]
      responses:
        "200": { description: The caller's orders, content: { application/json: { schema: { type: object } } } }
    post:
      tags: [Bookstore]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/BookOrder" }
          application/json:
            schema: { $ref: "#/components/schemas/BookOrder" }
      responses:
        "200": { description: Placed, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: E-mail not verified, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /bookstore/orders/{id}:
    get:
      tags: [Bookstore]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: The order, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, order: { type: object } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------- Notifications
  /notifications:
    get:
      tags: [Notifications]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { name: filter, in: query, schema: { type: string, enum: [all, unread] } }]
      responses:
        "200": { description: Notifications with unreadCount, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { properties: { unreadCount: { type: integer } } }] } } } }
    patch:
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { notificationId: { type: string }, markAllRead: { type: boolean } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /notifications/{id}:
    get:
      tags: [Notifications]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: The notification (now read), content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, notification: { type: object } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/device-token:
    post:
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string }, platform: { type: string, enum: [android, ios, web], default: android } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ------------------------------------------------------ Admin: Dashboard
  /admin/dashboard:
    get:
      tags: ["Admin: Dashboard"]
      summary: The admin sidebar groups with each page's count
      responses:
        "200":
          description: Groups and the links that need action
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        links: { type: array, items: { $ref: "#/components/schemas/DashboardLink" } }
                  actionRequired: { type: array, items: { $ref: "#/components/schemas/DashboardLink" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/audit-log:
    get:
      tags: ["Admin: Dashboard"]
      summary: The audit log, newest first
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: entity, in: query, description: One of `entities`, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: actor, in: query, description: Part of the actor's e-mail, schema: { type: string } }
      responses:
        "200":
          description: Entries, and every entity name for the filter
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      entities: { type: array, items: { type: string } }
                      data:
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            createdAt: { type: string, format: date-time }
                            actorId: { type: [string, "null"] }
                            actorEmail: { type: [string, "null"] }
                            actor: { type: string, description: 'E-mail, id or "system"' }
                            action: { type: string }
                            entity: { type: string }
                            entityId: { type: [string, "null"] }
                            reason: { type: [string, "null"] }
                            before: { description: JSON snapshot }
                            after: { description: JSON snapshot }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------- Admin: Students
  /admin/students:
    get:
      tags: ["Admin: Students"]
      summary: Students
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Q" }
        - { name: sort, in: query, schema: { type: string, enum: [regNo_asc, regNo_desc, name_asc, name_desc, date_asc, date_desc, email_asc, email_desc], default: regNo_asc } }
      responses:
        "200": { description: Students, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { properties: { data: { items: { $ref: "#/components/schemas/StaffStudent" } } } }] } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/students/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: ["Admin: Students"]
      summary: One student with their course enrollments
      responses:
        "200": { description: The student, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, student: { $ref: "#/components/schemas/StaffStudentDetail" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: ["Admin: Students"]
      summary: Saves the student edit form
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffStudentForm" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/StaffStudentForm" }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: ["Admin: Students"]
      summary: Deletes the account (refused while it has enrollments, pending fees or payment records)
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/students/{id}/payments:
    get:
      tags: ["Admin: Students"]
      summary: The student's payment history, newest first
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses:
        "200":
          description: Payment records (voided ones left out)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data:
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            paidAt: { type: string, format: date-time }
                            amountInrPaise: { type: integer }
                            courseId: { type: [string, "null"] }
                            courseTitle: { type: [string, "null"] }
                            description: { type: [string, "null"] }
                            receiptGeneratedAt: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/students/{id}/id-card:
    get:
      tags: ["Admin: Students"]
      summary: The student's ID card
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The student's profile is not complete, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/students/{id}/id-card/email:
    post:
      tags: ["Admin: Students"]
      summary: E-mails the ID card PDF to the student
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------- Admin: Teachers
  /admin/teachers:
    get:
      tags: ["Admin: Teachers"]
      summary: Teachers, newest first
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { $ref: "#/components/parameters/Q" }]
      responses:
        "200": { description: Teachers, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { properties: { data: { items: { $ref: "#/components/schemas/StaffTeacher" } } } }] } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: ["Admin: Teachers"]
      summary: Adds a teacher profile to a registered account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherForm" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/TeacherForm" }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/teachers/lookup:
    get:
      tags: ["Admin: Teachers"]
      summary: Checks the account behind an e-mail for the teacher form
      parameters:
        - { name: email, in: query, required: true, schema: { type: string } }
        - { name: excludeTeacherId, in: query, description: The teacher being edited, schema: { type: string } }
      responses:
        "200": { description: The check, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, lookup: { $ref: "#/components/schemas/AccountLookup" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/teachers/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: ["Admin: Teachers"]
      summary: One teacher and the courses they teach
      responses:
        "200":
          description: The teacher
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  teacher:
                    allOf:
                      - $ref: "#/components/schemas/StaffTeacher"
                      - type: object
                        properties:
                          bio: { type: string }
                          courses:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string }
                                title: { type: string }
                                category: { type: string }
                                status: { type: string }
                                statusLabel: { type: string }
                                studentCount: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: ["Admin: Teachers"]
      summary: Saves the teacher edit form
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherForm" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/TeacherForm" }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: ["Admin: Teachers"]
      summary: Deletes the teacher profile (refused while courses are assigned); the account stays
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------- Admin: Enrollments
  /admin/enrollments:
    get:
      tags: ["Admin: Enrollments"]
      summary: Pending enrollments (free requests or paid awaiting the fee)
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Q" }
        - { name: type, in: query, schema: { type: string, enum: [free_requests, paid_awaiting], default: free_requests } }
      responses:
        "200":
          description: The tab's enrollments, both tabs' counts and the courses the enrol form offers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      type: { type: string, enum: [free_requests, paid_awaiting] }
                      freeCount: { type: integer }
                      paidCount: { type: integer }
                      enrollableCourses: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string } } } }
                      data:
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            courseId: { type: string }
                            courseTitle: { type: string }
                            status: { $ref: "#/components/schemas/EnrollmentStatus" }
                            createdAt: { type: string, format: date-time }
                            user: { $ref: "#/components/schemas/UserRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: ["Admin: Enrollments"]
      summary: Enrols a registered account in a course
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, courseId], properties: { email: { type: string, format: email }, courseId: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/enrollments/lookup:
    get:
      tags: ["Admin: Enrollments"]
      summary: Checks the account behind an e-mail for the enrol form
      parameters: [{ name: email, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: The check, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, lookup: { $ref: "#/components/schemas/AccountLookup" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/enrollments/{id}:
    delete:
      tags: ["Admin: Enrollments"]
      summary: Removes a student from one course; the account stays
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: courseId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/enrollments/{id}/approve:
    post:
      tags: ["Admin: Enrollments"]
      summary: Approves a free-course enrollment request
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [courseId], properties: { courseId: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/enrollments/{id}/reject:
    post:
      tags: ["Admin: Enrollments"]
      summary: Rejects a pending enrollment (free request or paid awaiting the fee)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [courseId], properties: { courseId: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/StaffWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
