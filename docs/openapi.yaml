openapi: 3.1.0
info:
  title: Academy LMS mobile API
  version: "1.0.0"
  description: |
    The REST API the Android app uses (guest and student features, and the
    staff areas under /admin for admins and developers and /teacher for
    teachers). See docs/API.md for the conventions, the token refresh rules and
    the typical flows. Money is in paise; lists are paginated with page/pageSize.

    Staff writes take JSON, multipart or URL-encoded bodies with the website
    form's field names. In JSON, `true` is sent as the checkbox value "on" and
    `false`/null are left out; fields documented as the string "true" must be
    sent as that string.
servers:
  - url: https://darsequranacademy.com/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Auth
  - name: Account
  - name: Public
  - name: Blog
  - name: Courses
  - name: Payments
  - name: Bookstore
  - name: Notifications
  - name: "Admin: Dashboard"
    description: Admins and developers only, as are all /admin endpoints
  - name: "Admin: Students"
  - name: "Admin: Teachers"
  - name: "Admin: Enrollments"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Search:
      name: search
      in: query
      schema: { type: string }
    Q:
      name: q
      in: query
      description: Search text (the staff lists also accept it as `search`)
      schema: { type: string }
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string }
    AnnouncementId:
      name: announcementId
      in: path
      required: true
      schema: { type: string }
    GradeId:
      name: gradeId
      in: path
      required: true
      schema: { type: string }
    AttendanceDate:
      name: date
      in: path
      required: true
      description: The class day, YYYY-MM-DD
      schema: { type: string, format: date }
    BookId:
      name: bookId
      in: path
      required: true
      schema: { type: string }
    FinancePreset:
      name: preset
      in: query
      description: Date range; `custom` uses `from` and `to`
      schema: { type: string, enum: [this_month, last_month, this_year, all_time, custom] }
    FinanceFrom:
      name: from
      in: query
      description: Start of a custom range, YYYY-MM-DD
      schema: { type: string, format: date }
    FinanceTo:
      name: to
      in: query
      description: End of a custom range, YYYY-MM-DD
      schema: { type: string, format: date }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in, or the session has ended (refresh once, then sign in again)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (also used for records that belong to someone else)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate-limited; see the Retry-After header
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Ok:
      description: Done
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Ok" }
    Forbidden:
      description: Signed in without the staff role this endpoint needs (or a teacher account with no teacher profile)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StaffWrite:
      description: Done
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StaffWrite" }
    Pdf:
      description: The PDF
      content:
        application/pdf:
          schema: { type: string, format: binary }

  schemas:
    Ok:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error: { type: string, description: Message to show to the user }
        code:
          type: string
          description: Set for cases the app handles specially
          enum: [email_not_verified]
    Page:
      type: object
      required: [success, data, totalCount, page, pageSize]
      properties:
        success: { type: boolean }
        data: { type: array, items: {} }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Tokens:
      type: object
      required: [success, accessToken, expiresIn, refreshToken, refreshExpiresAt, user]
      properties:
        success: { type: boolean }
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconds }
        refreshToken: { type: string, description: Single use }
        refreshExpiresAt: { type: string, format: date-time }
        token: { type: string, deprecated: true, description: Same as accessToken }
        user: { $ref: "#/components/schemas/SessionUser" }
    SessionUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: [string, "null"] }
        role: { type: string, enum: [USER, TEACHER, ADMIN, DEVELOPER] }
        image: { type: [string, "null"] }
        registrationNumber: { type: [string, "null"] }
        emailVerified: { type: [string, "null"], format: date-time }

    Profile:
      type: object
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: string }
        fatherName: { type: [string, "null"] }
        dateOfBirth: { type: [string, "null"], format: date-time }
        occupation: { type: [string, "null"], description: "Value from /app-config lookups.occupations" }
        address: { type: [string, "null"] }
        whatsapp: { type: [string, "null"], description: Stored digits with the dial code }
        whatsappCountry: { type: [string, "null"], description: ISO country code }
        whatsappLocal: { type: [string, "null"] }
        gender: { type: [string, "null"], enum: [MALE, FEMALE, null] }
        registrationNumber: { type: [string, "null"] }
        emailVerified: { type: [string, "null"], format: date-time }
        image: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        role: { type: string }
        profileComplete: { type: boolean }
        hasPassword: { type: boolean }
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        fatherName: { type: string, minLength: 2, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        occupation: { type: string }
        address: { type: string }
        gender: { type: string, enum: [MALE, FEMALE] }
        country: { type: string, description: "ISO code; makes whatsapp a local number" }
        whatsapp: { type: string }
        image: { type: [string, "null"], description: Only the bundled avatars or the academy's own storage }

    Teacher:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        specialization: { type: string }
        bio: { type: string }
        initials: { type: string }
        imageUrl: { type: [string, "null"] }
    Course:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        startDate: { type: string }
        duration: { type: string }
        level: { type: string }
        category: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, ONGOING, COMPLETED, ON_HOLD, COMING_SOON] }
        priceInrPaise: { type: integer, description: Enrollment fee }
        monthlyFeeInrPaise: { type: integer, description: Course fee per period }
        feeFrequency: { type: [string, "null"], enum: [MONTHLY, EVERY_3_MONTHS, EVERY_6_MONTHS, YEARLY, ONE_TIME, null] }
        teacherId: { type: [string, "null"] }
        teacher: { oneOf: [{ $ref: "#/components/schemas/Teacher" }, { type: "null" }] }
    Book:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        description: { type: string }
        priceInrPaise: { type: integer }
        mrpInrPaise: { type: integer }
        status: { type: string, enum: [AVAILABLE, OUT_OF_STOCK, COMING_SOON] }
        imagePath: { type: [string, "null"] }
    Fatwa:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        question: { type: string }
        category: { type: string }
        answer: { type: [string, "null"], description: Sanitised HTML }
        askerName: { type: string, description: '"Anonymous" when the asker chose so' }
        answeredAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    CartItem:
      type: object
      properties:
        bookId: { type: string }
        title: { type: string }
        author: { type: string }
        priceInrPaise: { type: integer }
        mrpInrPaise: { type: integer }
        imagePath: { type: [string, "null"] }
        quantity: { type: integer }
    Cart:
      type: object
      properties:
        success: { type: boolean }
        items: { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        data: { type: array, items: { $ref: "#/components/schemas/CartItem" }, deprecated: true }
    CartLine:
      type: object
      required: [bookId, quantity]
      properties:
        bookId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20 }
    Comment:
      type: object
      properties:
        id: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: [string, "null"] }
            image: { type: [string, "null"] }

    PaymentSubmission:
      type: object
      required: [courseId, paymentType]
      properties:
        courseId: { type: string }
        paymentType: { type: string, enum: [enrollment, monthly] }
        paymentMonth: { type: string, pattern: "^(0[1-9]|1[0-2])$", description: 'Course fees only; "01" for one-time fees' }
        paymentYear: { type: string, pattern: "^[0-9]{4}$", description: Course fees only; one of the quote's yearOptions }
        paymentMethod: { type: string, enum: [upi, bank] }
        upiTransactionId: { type: string, description: Letters and digits; required unless the amount is 0 }
        couponId: { type: string, description: 'A coupon id from the quote, or "none"' }
        expectedAmountPaise: { type: integer, description: The amount shown; a different server price answers 409 }
        screenshot: { type: string, format: binary, description: Multipart only }
    BookOrder:
      type: object
      required: [items, paymentMethod, upiTransactionId, deliveryAddress, deliveryPinCode, deliveryPhoneNumber]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CartLine" }, description: In multipart, a JSON string }
        paymentMethod: { type: string }
        upiTransactionId: { type: string }
        deliveryAddress: { type: string, minLength: 10 }
        deliveryPinCode: { type: string, pattern: "^[0-9]{5,10}$" }
        deliveryPhoneNumber: { type: string, pattern: "^[0-9]{10,15}$" }
        notes: { type: string }
        screenshot: { type: string, format: binary, description: Multipart only }

    # ------------------------------------------------------------ Staff
    StaffWrite:
      type: object
      required: [success]
      description: |
        The outcome of a staff write. The endpoints run the website's own server
        actions: when the action redirects, `redirect` is the website page it went
        to (it may carry flags such as `email=failed`); otherwise `result` is the
        action's return value (often null, or `{ success, message }`).
      properties:
        success: { type: boolean, const: true }
        redirect: { type: string }
        result: {}
    Option:
      type: object
      properties:
        value: { type: string }
        label: { type: string }
    UserRef:
      type: object
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: string }
    StaffStudent:
      type: object
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: string }
        registrationNumber: { type: [string, "null"] }
        image: { type: [string, "null"] }
        gender: { type: [string, "null"], enum: [MALE, FEMALE, null] }
        createdAt: { type: string, format: date-time }
    StaffStudentDetail:
      allOf:
        - $ref: "#/components/schemas/StaffStudent"
        - type: object
          properties:
            fatherName: { type: [string, "null"] }
            dateOfBirth: { type: [string, "null"], format: date-time }
            dateOfBirthDisplay: { type: [string, "null"] }
            occupation: { type: [string, "null"] }
            occupationLabel: { type: [string, "null"] }
            address: { type: [string, "null"] }
            whatsapp: { type: [string, "null"] }
            profileComplete: { type: boolean }
            enrollments:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  courseId: { type: string }
                  courseTitle: { type: string }
                  rollNumber: { type: [string, "null"], description: Formatted roll number }
                  status: { $ref: "#/components/schemas/EnrollmentStatus" }
                  statusLabel: { type: string }
                  createdAt: { type: string, format: date-time }
    StaffStudentForm:
      type: object
      required: [name, fatherName, dateOfBirth, occupation, address, whatsapp, gender]
      properties:
        name: { type: string }
        fatherName: { type: string }
        dateOfBirth: { type: string, format: date }
        occupation: { type: string, description: "Value from /app-config lookups.occupations" }
        address: { type: string }
        whatsapp: { type: string }
        gender: { type: string, enum: [MALE, FEMALE] }
        confirmReplacePhoto: { type: string, enum: ["on"], description: Required when switching a student with an uploaded photo to FEMALE (the photo is replaced by the avatar) }
    EnrollmentStatus:
      type: string
      enum: [PENDING_APPROVAL, AWAITING_ENROLLMENT_FEE, ACTIVE, COMPLETED, REJECTED]
    StaffTeacher:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: [string, "null"] }
        specialization: { type: string }
        initials: { type: string }
        imageUrl: { type: [string, "null"] }
        published: { type: boolean }
        createdAt: { type: string, format: date-time }
    TeacherForm:
      type: object
      required: [email, specialization, bio]
      properties:
        email: { type: string, format: email, description: A registered account }
        specialization: { type: string }
        bio: { type: string }
        initials: { type: string, description: Derived from the account name when blank }
        published: { type: string, enum: ["on"], description: '"on" (JSON true) to show the teacher publicly' }
    AccountLookup:
      oneOf:
        - type: object
          properties:
            ok: { type: boolean, const: true }
            userId: { type: string }
            name: { type: [string, "null"] }
            email: { type: string }
            image: { type: [string, "null"] }
        - type: object
          properties:
            ok: { type: boolean, const: false }
            error: { type: string }
    DashboardLink:
      type: object
      properties:
        href: { type: string, description: The website path; the app maps it to its own screen }
        label: { type: string }
        count: { type: [integer, "null"], description: Null for tool pages with no number }
        highlight: { type: boolean, description: Needs action }

security:
  - bearer: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, acceptPolicies]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                acceptPolicies: { type: boolean, const: true }
      responses:
        "200": { description: Signed in (unverified), content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: "E-mail not verified (code email_not_verified)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/google:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string, description: Requested with the web OAuth client ID as server client ID }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        "200": { description: A new pair, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { refreshToken: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "200": { description: Generic answer, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, message: { type: string } } } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/resend-verification:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------- Account
  /auth/me:
    get:
      tags: [Account]
      responses:
        "200": { description: The profile, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, user: { $ref: "#/components/schemas/Profile" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200": { description: The updated profile, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, user: { $ref: "#/components/schemas/Profile" } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Account]
      description: Deletes the account. Receipts and fee history are kept anonymised.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, description: Password accounts }
                confirm: { type: string, const: DELETE, description: Google-only accounts }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: A fee payment or book order is still being processed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/me/photo:
    post:
      tags: [Account]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, image: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Account]
      responses:
        "200": { description: Back to the avatar, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, image: { type: string } } } } } }
  /auth/change-password:
    post:
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # -------------------------------------------------------------- Public
  /app-config:
    get:
      tags: [Public]
      security: []
      responses:
        "200":
          description: Branding, policies, lookups, features and limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  brand: { type: object }
                  policies: { type: object, properties: { version: { type: string }, privacyPolicyUrl: { type: string }, termsUrl: { type: string } } }
                  links: { type: object }
                  lookups:
                    type: object
                    properties:
                      countries: { type: array, items: { type: object, properties: { code: { type: string }, name: { type: string }, dialCode: { type: string }, flag: { type: string }, localNumberMinLength: { type: integer }, localNumberMaxLength: { type: integer } } } }
                      defaultCountryCode: { type: string }
                      occupations: { type: array, items: { type: object } }
                      fatwaCategories: { type: array, items: { type: string } }
                  features: { type: object, properties: { googleSignIn: { type: boolean }, onlinePayments: { type: boolean }, feeWaiverRequests: { type: boolean } } }
                  limits: { type: object, properties: { maxBookQuantityPerOrder: { type: integer } } }
  /home:
    get:
      tags: [Public]
      security: []
      responses:
        "200":
          description: Homepage sections
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  dailyInspiration: { type: [object, "null"] }
                  announcements: { type: array, items: { type: object } }
                  courses: { type: array, items: { $ref: "#/components/schemas/Course" } }
                  blogPosts: { type: array, items: { type: object } }
                  libraryItems: { type: array, items: { type: object } }
                  books: { type: array, items: { $ref: "#/components/schemas/Book" } }
                  fatwas: { type: array, items: { $ref: "#/components/schemas/Fatwa" } }
                  reviews: { type: array, items: { type: object } }
  /courses:
    get:
      tags: [Public]
      security: []
